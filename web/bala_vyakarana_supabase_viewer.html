<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>బాల వ్యాకరణము — Supabase Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Telugu:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --surface-2:#f4efe7; --surface-3:#efe8dd;
  --border:rgba(58,42,26,.14); --border-strong:rgba(58,42,26,.26);
  --text:#2a251f; --text-dim:#6f6558; --text-faint:#9a8f80;
  --accent:#b4441f; --accent-dim:#f3e3da;
  --sutra:#1c3d5a; --sage:#5f7a4f; --gold:#a9772a;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans","Noto Sans Telugu",system-ui,-apple-system,sans-serif;
  --font-tel:"Noto Serif Telugu","Noto Sans Telugu",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(40,30,15,.05),0 8px 24px rgba(40,30,15,.05);
}
@media (prefers-color-scheme: dark){
:root{
  --bg:#191612; --surface:#221e18; --surface-2:#2a251d; --surface-3:#332c22;
  --border:rgba(255,238,214,.11); --border-strong:rgba(255,238,214,.22);
  --text:#ece3d5; --text-dim:#a99c89; --text-faint:#7d7263;
  --accent:#e08159; --accent-dim:#3a2820;
  --sutra:#93b8dc; --sage:#9cb888; --gold:#d6ab5e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 15% -10%,var(--accent-dim),transparent 45%);
  background-attachment:fixed;
}
.top{
  position:sticky;top:0;z-index:30;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:var(--bg);backdrop-filter:saturate(1.4) blur(10px);
}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{width:44px;height:44px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-family:var(--font-tel);font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.brand h1{margin:0;font-family:var(--font-tel);font-size:20px;font-weight:600}
.brand .tl{font-family:var(--font-display);font-style:italic;color:var(--text-dim);font-size:16px;margin-left:6px}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--text-dim);font-family:var(--font-tel)}
.live{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sage);border:1px solid var(--border);border-radius:20px;padding:3px 9px;margin-left:10px;vertical-align:middle}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search input{width:min(44vw,320px);padding:9px 13px 9px 34px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search .mag{position:absolute;left:11px;color:var(--text-faint)}
.hint{font-size:12px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap}
.btn{font-family:var(--font-body);font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.layout{display:grid;grid-template-columns:290px 1fr;align-items:start}
.side{position:sticky;top:73px;height:calc(100dvh - 73px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--border)}
.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:4px 8px 10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 6px 16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.stat b{display:block;font-family:var(--font-display);font-size:24px;line-height:1;color:var(--accent)}
.stat span{font-size:11px;color:var(--text-dim)}
nav a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;text-decoration:none;
  color:var(--text);border:1px solid transparent;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--surface);border-color:var(--border-strong);box-shadow:var(--shadow)}
nav a .ord{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);min-width:16px;text-align:right}
nav a .nm{font-family:var(--font-tel);font-size:14.5px;flex:1;min-width:0}
nav a .tr{display:block;font-family:var(--font-body);font-size:11px;color:var(--text-dim)}
nav a .ct{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
main{padding:26px 34px 80px;max-width:1000px;min-width:0}
.phead{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.phead .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.phead h2{margin:6px 0 2px;font-family:var(--font-tel);font-size:29px;font-weight:600}
.phead .tr{font-family:var(--font-display);font-style:italic;color:var(--text-dim);font-size:17px}
.phead .en{color:var(--text-dim);font-size:13px;margin-top:4px}
.phead .meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.chip b{color:var(--accent)}
.sutra{display:grid;grid-template-columns:46px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.sutra:hover{background:linear-gradient(90deg,var(--surface-2),transparent 70%)}
.snum{font-family:var(--font-mono);font-size:14px;font-weight:500;color:#fff;background:var(--accent);
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;justify-self:center}
.sbody{min-width:0}
.stext{margin:0;font-family:var(--font-tel);font-size:18px;font-weight:600;color:var(--sutra);line-height:1.65;white-space:pre-line}
.ex{margin:11px 0 2px;border-collapse:collapse;font-family:var(--font-tel);font-size:15.5px;width:100%;max-width:760px}
.ex td{padding:5px 11px;border:1px solid var(--border);color:var(--text);vertical-align:top;white-space:pre-line}
.ex tr:nth-child(even) td{background:var(--surface-2)}
.ex td.op{text-align:center;color:var(--accent);font-family:var(--font-mono);width:1%;white-space:nowrap}
.ex td.res{color:var(--sage);font-weight:600}
.note{margin:10px 0 2px;padding:9px 13px;border-left:3px solid var(--gold);background:var(--surface-2);
  border-radius:0 8px 8px 0;font-family:var(--font-tel);font-size:15px;color:var(--text-dim);white-space:pre-line;max-width:760px}
.heading{margin:26px 0 6px;font-family:var(--font-tel);font-size:20px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:12px}
.heading::before{content:"";width:22px;height:2px;background:var(--gold);flex:none}
.verse{margin:12px 0;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-family:var(--font-tel);font-size:16px;line-height:1.8;white-space:pre-line}
.para{margin:12px 0;font-family:var(--font-tel);font-size:16.5px;line-height:1.85;white-space:pre-line;max-width:820px}
mark{background:var(--accent-dim);color:var(--accent);border-radius:3px;padding:0 2px}
.empty{color:var(--text-dim);font-style:italic;padding:30px 0}
footer{border-top:1px solid var(--border);padding:18px 34px;color:var(--text-faint);font-size:12px;font-family:var(--font-mono)}
footer a{color:var(--text-dim)}
/* connect card */
.wrap{max-width:620px;margin:8vh auto;padding:0 22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px 26px 22px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-family:var(--font-tel);font-size:24px}
.card .sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px}
label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 6px}
.card input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.card .row{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.msg{font-size:13px;font-family:var(--font-mono);margin-top:12px;min-height:18px}
.msg.err{color:#c0392b}.msg.ok{color:var(--sage)}
.note-sm{font-size:12.5px;color:var(--text-dim);margin-top:18px;padding-top:14px;border-top:1px solid var(--border);line-height:1.6}
.note-sm code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  main{padding:20px}
  .search input{width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark">బా</div>
    <div>
      <h1>బాల వ్యాకరణము<span class="tl">Bala Vyakarana</span><span class="live" id="live" style="display:none">● live</span></h1>
      <p>చిన్నయ సూరి · Chinnaya Suri</p>
    </div>
  </div>
  <div class="right">
    <div class="search" id="searchwrap" style="display:none">
      <span class="mag">⌕</span>
      <input id="q" type="search" placeholder="Search sutras…" autocomplete="off">
      <span class="hint" id="qhint" style="margin-left:10px"></span>
    </div>
    <button class="btn" id="settings" style="display:none">Connection</button>
  </div>
</header>

<div id="app"></div>

<footer>
  Reads live from your Supabase project · tables
  <code style="font-family:var(--font-mono)">bala_vyakarana_paricchedas</code>,
  <code style="font-family:var(--font-mono)">bala_vyakarana_items</code>
</footer>

<script>
const PROJECT_URL = "https://qndkvizszwdvhrccjxtr.supabase.co";
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb=null, D=null, cur=null;

/* ---------- connect screen ---------- */
function connectScreen(prefillUrl, prefillKey, msg, msgType){
  $('searchwrap').style.display='none'; $('settings').style.display='none'; $('live').style.display='none';
  app.innerHTML =
    '<div class="wrap"><div class="card">'+
    '<h2>Connect to Supabase</h2>'+
    '<p class="sub">This viewer reads your <em>బాల వ్యాకరణము</em> tables directly from your project. Nothing is stored on a server — the values below stay in this browser only.</p>'+
    '<label>Project URL</label>'+
    '<input id="u" value="'+esc(prefillUrl||PROJECT_URL)+'" spellcheck="false">'+
    '<label>Anon / publishable key</label>'+
    '<input id="k" type="password" value="'+esc(prefillKey||'')+'" placeholder="paste your anon / publishable key" spellcheck="false">'+
    '<div class="row"><button class="btn primary" id="go">Connect</button>'+
    '<label style="margin:0;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:13px;color:var(--text-dim)"><input type="checkbox" id="remember" checked style="width:auto"> Remember in this browser</label></div>'+
    '<div class="msg '+(msgType||'')+'" id="cmsg">'+esc(msg||'')+'</div>'+
    '<div class="note-sm">Find the key in your Supabase dashboard under <code>Project Settings → API</code> (the <code>anon</code> / publishable key). '+
    'Note: your tables currently have Row Level Security <b>disabled</b>, so anyone holding this key can read <i>and write</i> them — see the RLS note before sharing this file or key.</div>'+
    '</div></div>';
  $('go').onclick = () => {
    const u=$('u').value.trim(), k=$('k').value.trim();
    if(!u||!k){ $('cmsg').className='msg err'; $('cmsg').textContent='Enter both the project URL and the key.'; return; }
    $('cmsg').className='msg'; $('cmsg').textContent='Connecting…';
    connect(u,k,$('remember').checked);
  };
}

/* ---------- data ---------- */
async function connect(url,key,remember){
  try{
    sb = window.supabase.createClient(url,key);
    const [pr, ir] = await Promise.all([
      sb.from('bala_vyakarana_paricchedas').select('*').order('ord',{ascending:true}),
      sb.from('bala_vyakarana_items').select('*').order('item_order',{ascending:true})
    ]);
    if(pr.error) throw pr.error;
    if(ir.error) throw ir.error;
    build(pr.data, ir.data);
    if(remember){ localStorage.setItem('bvgz_url',url); localStorage.setItem('bvgz_key',key); }
    else { localStorage.removeItem('bvgz_url'); localStorage.removeItem('bvgz_key'); }
    startUI();
  }catch(e){
    const m=(e&&(e.message||e.error_description))||String(e);
    connectScreen(url,key,'Connection failed: '+m,'err');
  }
}

function build(prows, irows){
  const ps = prows.map(p=>({
    id:p.id, order:p.ord, title_te:p.title_te, title_translit:p.title_translit,
    title_en:p.title_en, url:p.url, sutra_count:p.sutra_count,
    headings:p.headings||[], items:[]
  }));
  const byId = Object.fromEntries(ps.map(p=>[p.id,p]));
  irows.forEach(it=>{
    const p=byId[it.pariccheda_id]; if(!p) return;
    p.items.push({_o:it.item_order, type:it.type, number:it.sutra_number, number_raw:it.sutra_number_raw,
      title:it.title, text:it.text, examples:it.examples});
  });
  ps.sort((a,b)=>a.order-b.order);
  ps.forEach(p=>p.items.sort((a,b)=>(a._o||0)-(b._o||0)));
  D = { paricchedas:ps,
        stats:{paricchedas:ps.length, sutras_total:ps.reduce((n,p)=>n+(p.sutra_count||0),0)} };
}

/* ---------- render ---------- */
function examplesHTML(ex){
  if(!ex||!ex.length) return '';
  let h='';
  for(const tbl of ex){
    if(!tbl||!tbl.length) continue;
    if(tbl.length===1 && tbl[0].length===1){ h+='<div class="note">'+esc(tbl[0][0])+'</div>'; continue; }
    h+='<table class="ex"><tbody>';
    for(const row of tbl){
      const deriv = row.length>=3 && row.some(c=>String(c).trim()==='+') && row.some(c=>String(c).trim()==='=');
      h+='<tr>';
      row.forEach((c,i)=>{ const t=String(c).trim(); let cls='';
        if(deriv&&(t==='+'||t==='=')) cls='op'; else if(deriv&&i===row.length-1) cls='res';
        h+='<td class="'+cls+'">'+esc(c)+'</td>'; });
      h+='</tr>';
    }
    h+='</tbody></table>';
  }
  return h;
}
function itemHTML(it){
  if(it.type==='heading') return '<div class="heading">'+esc(it.title)+'</div>';
  if(it.type==='verse')   return '<div class="verse">'+esc(it.text)+'</div>';
  if(it.type==='paragraph')return '<div class="para">'+esc(it.text)+'</div>';
  const num = it.number!=null?it.number:(it.number_raw||'·');
  return '<article class="sutra"><div class="snum">'+esc(num)+'</div><div class="sbody"><p class="stext">'+esc(it.text)+'</p>'+examplesHTML(it.examples)+'</div></article>';
}
function renderPariccheda(p){
  const heads=(p.headings&&p.headings.length)?'<span class="chip">'+p.headings.map(esc).join(' · ')+'</span>':'';
  app.innerHTML =
    '<div class="layout"><aside class="side">'+
      '<div class="statgrid"><div class="stat"><b>'+D.stats.paricchedas+'</b><span>paricchedas</span></div>'+
      '<div class="stat"><b>'+D.stats.sutras_total+'</b><span>sutras</span></div></div>'+
      '<div class="lbl">Paricchedas</div><nav id="nav"></nav></aside>'+
    '<main id="main"></main></div>';
  const nav=$('nav');
  nav.innerHTML = D.paricchedas.map(x=>
    '<a data-id="'+x.id+'" class="'+(x.id===p.id?'on':'')+'"><span class="ord">'+x.order+'</span>'+
    '<span class="nm">'+esc(x.title_te)+'<span class="tr">'+esc(x.title_translit)+'</span></span>'+
    '<span class="ct">'+x.sutra_count+'</span></a>').join('');
  [...nav.children].forEach(a=>a.onclick=()=>select(a.dataset.id));
  $('main').innerHTML =
    '<div class="phead"><div class="kick">Pariccheda '+p.order+' / '+D.paricchedas.length+'</div>'+
    '<h2>'+esc(p.title_te)+'</h2><div class="tr">'+esc(p.title_translit)+'</div>'+
    '<div class="en">'+esc(p.title_en||'')+'</div>'+
    '<div class="meta"><span class="chip"><b>'+p.sutra_count+'</b> sutras</span>'+heads+
    '<span class="chip">'+p.items.length+' items</span></div></div>'+
    p.items.map(itemHTML).join('');
  window.scrollTo({top:0});
}
function renderSearch(term){
  const t=term.toLowerCase(); let hits=[];
  for(const p of D.paricchedas) for(const it of p.items){
    if(it.type==='heading') continue;
    if(((it.text||'')+' '+(it.number_raw||'')).toLowerCase().includes(t)) hits.push({p,it});
  }
  $('qhint').textContent=hits.length+' match'+(hits.length===1?'':'es');
  const main=$('main');
  if(!hits.length){ main.innerHTML='<div class="empty">No sutras match “'+esc(term)+'”.</div>'; return; }
  let out='<div class="phead"><div class="kick">Search</div><h2 style="font-family:var(--font-body);font-size:20px">'+hits.length+' matches for “'+esc(term)+'”</h2></div>';
  let last=null;
  for(const {p,it} of hits){
    if(p.id!==last){ out+='<div class="heading" style="color:var(--accent)">'+esc(p.title_te)+'</div>'; last=p.id; }
    const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    out+='<article class="sutra"><div class="snum">'+esc(it.number!=null?it.number:(it.number_raw||'·'))+'</div>'+
         '<div class="sbody"><p class="stext">'+esc(it.text).replace(re,'<mark>$1</mark>')+'</p></div></article>';
  }
  main.innerHTML=out;
}
function select(id){ cur=id; renderPariccheda(D.paricchedas.find(p=>p.id===id)); $('q').value=''; $('qhint').textContent=''; }

function startUI(){
  $('searchwrap').style.display='flex'; $('settings').style.display='inline-block'; $('live').style.display='inline';
  cur=D.paricchedas[0].id; renderPariccheda(D.paricchedas[0]);
  $('settings').onclick=()=>connectScreen(localStorage.getItem('bvgz_url')||PROJECT_URL, localStorage.getItem('bvgz_key')||'', '');
  let timer=null;
  $('q').addEventListener('input',()=>{ clearTimeout(timer); const v=$('q').value.trim();
    timer=setTimeout(()=>{ if(v.length<2){ $('qhint').textContent=''; select(cur); } else renderSearch(v); },160); });
}

/* ---------- boot ---------- */
(function(){
  const u=localStorage.getItem('bvgz_url'), k=localStorage.getItem('bvgz_key');
  if(u&&k){ connect(u,k,true); }
  else { connectScreen(PROJECT_URL,'',''); }
})();
</script>
</body>
</html>
